<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lahore Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-card">
        <div class="search-section">
            <input type="text" id="city-input" placeholder="Enter city name (e.g. Lahore)">
            <input type="submit" id="search-btn" value="Search">
        </div>

        <p id="error-message" class="error hidden"></p>

        <div class="weather-info" id="weather-info">
            <h2 id="city-name">Lahore, PK</h2>
            <div class="temp-container">
                <img id="weather-icon" src="" alt="Weather Icon">
                <h1 id="temp">25°C</h1>
            </div>
            <p id="description">Haze</p>
            
            <div class="details">
                <div class="col">
                    <p>Humidity</p>
                    <p id="humidity">50%</p>
                </div>
                <div class="col" id="speed">
                    <p>Wind Speed</p>
                    <p id="wind-speed">10 km/h</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
